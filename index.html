<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BetCore - Canlı İddaa & Spor Bülteni</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            nesine: {
              yellow: '#F6C800',
              yellowHover: '#E0B500',
              dark: '#121212',
              card: '#1E1E1E',
              subcard: '#282828',
              border: '#333333',
              green: '#22c55e',
              red: '#ef4444'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM, Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #E2E8F0;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #181818; }
    ::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
  </style>
</head>
<body class="bg-nesine-dark text-gray-200 antialiased selection:bg-nesine-yellow selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SES MOTORU ---
    const playChime = (type = 'click') => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'goal') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.6);
        } else if (type === 'cashout') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        }
      } catch (e) {}
    };

    const Icons = {
      Live: () => (
        <span className="relative flex h-2.5 w-2.5">
          <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
          <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
        </span>
      ),
      Search: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      ),
      Coin: () => (
        <svg className="w-4 h-4 text-nesine-yellow inline-block" fill="currentColor" viewBox="0 0 20 20">
          <circle cx="10" cy="10" r="8" fill="#F6C800" />
          <path fill="#000" d="M10 5a1 1 0 011 1v1h1a1 1 0 110 2h-1v2h1a1 1 0 110 2h-1v1a1 1 0 11-2 0v-1H8a1 1 0 110-2h1v-2H8a1 1 0 010-2h1V6a1 1 0 011-1z" />
        </svg>
      ),
      User: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      )
    };

    // LİG KATEGORİLERİ VE KODLARI
    const LEAGUE_CATEGORIES = [
      {
        category: "🇹🇷 Türkiye",
        leagues: [
          { id: 'superlig', name: 'Trendyol Süper Lig', code: 'tur.1' },
          { id: 'tur1lig', name: 'Trendyol 1. Lig', code: 'tur.2' }
        ]
      },
      {
        category: "🌍 Avrupa Majör",
        leagues: [
          { id: 'premier', name: 'İngiltere Premier Lig', code: 'eng.1' },
          { id: 'laliga', name: 'İspanya La Liga', code: 'esp.1' },
          { id: 'seriea', name: 'İtalya Serie A', code: 'ita.1' },
          { id: 'bundesliga', name: 'Almanya Bundesliga', code: 'ger.1' },
          { id: 'ligue1', name: 'Fransa Ligue 1', code: 'fra.1' },
          { id: 'eredivisie', name: 'Hollanda Eredivisie', code: 'ned.1' }
        ]
      },
      {
        category: "🏆 Uluslararası Turnuvalar",
        leagues: [
          { id: 'champions', name: 'UEFA Şampiyonlar Ligi', code: 'uefa.champions' },
          { id: 'europa', name: 'UEFA Avrupa Ligi', code: 'uefa.europa' }
        ]
      }
    ];

    const ALL_LEAGUES = LEAGUE_CATEGORIES.flatMap(c => c.leagues);

    function App() {
      // KULLANICI VERİ TABANI
      const [usersDb, setUsersDb] = useState(() => {
        try {
          const saved = localStorage.getItem('betcore_users_db');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return {};
      });

      // AKTİF KULLANICI (Varsayılan olarak NULL -> Giriş Yapılmadı)
      const [activeUsername, setActiveUsername] = useState(() => {
        return localStorage.getItem('betcore_active_session') || null;
      });

      const isLoggedIn = !!activeUsername && !!usersDb[activeUsername];
      const currentUser = isLoggedIn ? usersDb[activeUsername] : null;
      const coins = currentUser ? currentUser.coins : 0;
      const betsHistory = currentUser ? currentUser.history : [];

      useEffect(() => {
        localStorage.setItem('betcore_users_db', JSON.stringify(usersDb));
      }, [usersDb]);

      useEffect(() => {
        if (activeUsername) {
          localStorage.setItem('betcore_active_session', activeUsername);
        } else {
          localStorage.removeItem('betcore_active_session');
        }
      }, [activeUsername]);

      const updateUserCoins = (newCoins) => {
        if (!isLoggedIn) return;
        setUsersDb(prev => ({
          ...prev,
          [activeUsername]: { ...prev[activeUsername], coins: newCoins }
        }));
      };

      const updateUserHistory = (newHistory) => {
        if (!isLoggedIn) return;
        setUsersDb(prev => ({
          ...prev,
          [activeUsername]: { ...prev[activeUsername], history: newHistory }
        }));
      };

      // SPOR VERİLERİ DURAĞI
      const [fixtures, setFixtures] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [fetchError, setFetchError] = useState(null);
      const [pollSecondsLeft, setPollSecondsLeft] = useState(60);

      // UI
      const [activeTab, setActiveTab] = useState('bulten');
      const [selectedLeague, setSelectedLeague] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedBetSlip, setSelectedBetSlip] = useState([]);
      const [slipStake, setSlipStake] = useState(100);
      const [mobileSlipOpen, setMobileSlipOpen] = useState(false);
      const [detailModalMatch, setDetailModalMatch] = useState(null);

      // AUTH MODAL
      const [authModalOpen, setAuthModalOpen] = useState(!isLoggedIn);
      const [authTab, setAuthTab] = useState('login');
      const [authUsernameInput, setAuthUsernameInput] = useState('');
      const [authPasswordInput, setAuthPasswordInput] = useState('');
      const [authMessage, setAuthMessage] = useState(null);

      // GÜVENLİ CANLI SPOR VERİSİ ÇEKME MOTORU (CORS SAFE)
      const fetchRealFixtures = async () => {
        setIsLoading(true);
        setFetchError(null);

        try {
          const fetchPromises = ALL_LEAGUES.map(async (lg) => {
            const primaryUrl = `https://site.api.espn.com/apis/site/v2/sports/soccer/${lg.code}/scoreboard`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(primaryUrl)}`;

            let data = null;
            try {
              const res = await fetch(primaryUrl);
              if (res.ok) data = await res.json();
            } catch (err) {
              try {
                const resProxy = await fetch(proxyUrl);
                if (resProxy.ok) data = await resProxy.json();
              } catch (e2) {}
            }

            if (!data || !data.events) return [];

            return data.events.map((ev, index) => {
              const comp = ev.competitions?.[0];
              const homeTeam = comp?.competitors?.find(c => c.homeAway === 'home');
              const awayTeam = comp?.competitors?.find(c => c.homeAway === 'away');
              const statusState = ev.status?.type?.state;
              const isLive = statusState === 'in';
              const isFinished = statusState === 'post';

              let matchTime = "20:00";
              let minute = null;
              if (isLive) {
                matchTime = "CANLI";
                minute = ev.status?.displayClock ? `${ev.status.displayClock}'` : "CANLI";
              } else if (isFinished) {
                matchTime = "MS";
              } else {
                try {
                  matchTime = new Date(ev.date).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                } catch (e) {}
              }

              const sHome = (homeTeam?.score !== undefined && homeTeam?.score !== null && homeTeam?.score !== "")
                ? parseInt(homeTeam.score) : null;
              const sAway = (awayTeam?.score !== undefined && awayTeam?.score !== null && awayTeam?.score !== "")
                ? parseInt(awayTeam.score) : null;

              let oddsData = { ms1: 2.10, msX: 3.25, ms2: 3.00, alt25: 1.85, ust25: 1.75, kgVar: 1.60, kgYok: 2.05 };
              if (isLive && sHome !== null && sAway !== null) {
                if (sHome > sAway) { oddsData.ms1 = 1.25; oddsData.msX = 4.20; oddsData.ms2 = 7.50; }
                else if (sAway > sHome) { oddsData.ms1 = 6.80; oddsData.msX = 4.10; oddsData.ms2 = 1.35; }
                else { oddsData.ms1 = 2.40; oddsData.msX = 2.40; oddsData.ms2 = 2.70; }
              }

              const numericId = parseInt(ev.id) || (index + 400);
              const matchCode = (100 + (numericId % 899)).toString();

              return {
                id: ev.id || `espn_${lg.id}_${index}`,
                code: matchCode,
                league: lg.id,
                leagueName: lg.name,
                dateFormatted: new Date(ev.date).toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit' }),
                time: matchTime,
                minute: minute,
                isLive: isLive,
                isFinished: isFinished,
                home: homeTeam?.team?.displayName || "Ev Sahibi",
                away: awayTeam?.team?.displayName || "Deplasman",
                homeLogo: homeTeam?.team?.logo || null,
                awayLogo: awayTeam?.team?.logo || null,
                scoreHome: sHome,
                scoreAway: sAway,
                odds: oddsData
              };
            });
          });

          const results = await Promise.all(fetchPromises);
          const realMatches = results.flat();
          setFixtures(realMatches);
        } catch (error) {
          setFetchError("Canlı spor ağı bağlantısında aksama oldu.");
        } finally {
          setIsLoading(false);
          setPollSecondsLeft(60);
        }
      };

      useEffect(() => {
        fetchRealFixtures();
        const interval = setInterval(() => {
          setPollSecondsLeft(prev => {
            if (prev <= 1) {
              fetchRealFixtures();
              return 60;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      // ORAN SEÇİMİ
      const handleToggleOdd = (match, marketName, oddName, oddValue) => {
        if (!isLoggedIn) {
          setAuthModalOpen(true);
          return alert("Kupon yapmak için önce giriş yapmalı veya kayıt olmalısınız!");
        }
        playChime('click');
        setSelectedBetSlip(prev => {
          const existingIndex = prev.findIndex(item => item.matchId === match.id);
          if (existingIndex > -1 && prev[existingIndex].oddName === oddName) return prev.filter((_, idx) => idx !== existingIndex);
          const newItem = { matchId: match.id, matchCode: match.code, home: match.home, away: match.away, market: marketName, oddName, oddValue: parseFloat(oddValue) };
          if (existingIndex > -1) { const updated = [...prev]; updated[existingIndex] = newItem; return updated; }
          return [...prev, newItem];
        });
      };

      const totalOdds = useMemo(() => selectedBetSlip.length === 0 ? 0 : selectedBetSlip.reduce((acc, item) => acc * item.oddValue, 1).toFixed(2), [selectedBetSlip]);
      const potentialPayout = useMemo(() => (totalOdds * slipStake).toFixed(0), [totalOdds, slipStake]);

      const handlePlaceBet = () => {
        if (!isLoggedIn) { setAuthModalOpen(true); return; }
        if (selectedBetSlip.length === 0) return alert("Kupona maç ekleyin!");
        if (coins < slipStake) return alert("Yetersiz Core Coins bakiye!");

        const newBet = {
          id: 'bet_' + Date.now(),
          date: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
          stake: parseFloat(slipStake),
          totalOdds: parseFloat(totalOdds),
          potentialPayout: parseFloat(potentialPayout),
          selections: [...selectedBetSlip],
          status: 'Devam Ediyor'
        };

        updateUserCoins(coins - slipStake);
        updateUserHistory([newBet, ...betsHistory]);
        setSelectedBetSlip([]);
        setMobileSlipOpen(false);
        playChime('cashout');
        alert("Kupon başarıyla yatırıldı!");
      };

      // AUTH HANDLERS
      const handleLogin = (e) => {
        e.preventDefault();
        const uname = authUsernameInput.trim();
        const pass = authPasswordInput.trim();
        if (usersDb[uname] && usersDb[uname].password === pass) {
          setActiveUsername(uname);
          setAuthModalOpen(false);
          setAuthMessage(null);
        } else {
          setAuthMessage('Hatalı kullanıcı adı veya şifre!');
        }
      };

      const handleRegister = (e) => {
        e.preventDefault();
        const uname = authUsernameInput.trim();
        const pass = authPasswordInput.trim();
        if (!uname || !pass) return setAuthMessage('Kullanıcı adı ve şifre gereklidir.');
        if (usersDb[uname]) return setAuthMessage('Bu kullanıcı adı zaten alınmış!');

        setUsersDb(prev => ({
          ...prev,
          [uname]: { password: pass, coins: 10000, history: [], createdAt: new Date().toLocaleDateString('tr-TR') }
        }));
        setActiveUsername(uname);
        setAuthModalOpen(false);
        setAuthMessage(null);
      };

      const handleLogout = () => {
        setActiveUsername(null);
        setSelectedBetSlip([]);
      };

      const filteredFixtures = useMemo(() => {
        return fixtures.filter(m => {
          const matchFilter = selectedLeague === 'all' || m.league === selectedLeague;
          const searchFilter = m.home.toLowerCase().includes(searchQuery.toLowerCase()) ||
                               m.away.toLowerCase().includes(searchQuery.toLowerCase()) ||
                               m.code.includes(searchQuery);
          const tabFilter = activeTab === 'canli' ? m.isLive : true;
          return matchFilter && searchFilter && tabFilter;
        });
      }, [fixtures, selectedLeague, searchQuery, activeTab]);

      return (
        <div className="min-h-screen flex flex-col bg-nesine-dark pb-24 lg:pb-8">
          
          {/* HEADER */}
          <header className="sticky top-0 z-40 bg-[#1A1A1A] border-b border-nesine-border shadow-md">
            <div className="max-w-[1600px] mx-auto px-4 h-16 flex items-center justify-between">
              
              <div className="flex items-center space-x-3">
                <div onClick={() => setActiveTab('bulten')} className="cursor-pointer flex items-center space-x-2 select-none">
                  <div className="bg-nesine-yellow text-black font-black text-2xl px-2.5 py-0.5 rounded tracking-tighter">BET</div>
                  <span className="font-black text-xl text-white tracking-wide">CORE</span>
                </div>
                <div className="hidden sm:flex items-center space-x-1.5 bg-[#242424] px-2.5 py-1 rounded-full border border-nesine-border text-[11px]">
                  <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                  <span className="font-semibold text-gray-300">Sistem Çevrimiçi (ESPN)</span>
                  <span className="text-gray-500">|</span>
                  <span className="text-nesine-yellow font-mono">{pollSecondsLeft}s</span>
                </div>
              </div>

              {/* ARAMA */}
              <div className="hidden md:flex items-center flex-1 max-w-md mx-6">
                <div className="relative w-full">
                  <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><Icons.Search /></span>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Takım, lig veya maç kodu..."
                    className="w-full bg-[#121212] text-sm text-gray-200 pl-10 pr-4 py-1.5 rounded-full border border-nesine-border focus:border-nesine-yellow outline-none"
                  />
                </div>
              </div>

              {/* SAĞ PANEL */}
              <div className="flex items-center space-x-2.5">
                <button onClick={fetchRealFixtures} className="p-2 rounded-full bg-[#242424] border border-nesine-border text-gray-300 text-xs">
                  <span className={isLoading ? "animate-spin inline-block" : ""}>🔄</span>
                </button>

                {isLoggedIn ? (
                  <>
                    <div className="flex items-center space-x-1.5 bg-[#252525] border border-yellow-500/30 px-3 py-1.5 rounded-lg">
                      <Icons.Coin />
                      <div className="flex flex-col text-right">
                        <span className="text-[10px] text-gray-400 leading-none">Bakiye</span>
                        <span className="font-extrabold text-sm text-nesine-yellow leading-tight">{coins.toLocaleString('tr-TR')} CC</span>
                      </div>
                    </div>
                    <button onClick={handleLogout} className="bg-red-950/60 border border-red-800 text-red-300 px-2.5 py-1.5 rounded-lg text-xs font-bold">
                      Çıkış
                    </button>
                  </>
                ) : (
                  <button onClick={() => setAuthModalOpen(true)} className="bg-nesine-yellow text-black font-extrabold px-3.5 py-1.5 rounded-lg text-xs">
                    Giriş Yap / Kayıt Ol
                  </button>
                )}
              </div>
            </div>

            {/* SEKME MENÜSÜ */}
            <nav className="bg-[#141414] border-t border-nesine-border px-4 overflow-x-auto scrollbar-none">
              <div className="max-w-[1600px] mx-auto flex space-x-4 text-xs sm:text-sm font-semibold">
                <button onClick={() => setActiveTab('bulten')} className={`py-2.5 px-2 border-b-2 whitespace-nowrap ${activeTab === 'bulten' ? 'border-nesine-yellow text-nesine-yellow' : 'border-transparent text-gray-400'}`}>
                  ⚽ Canlı Bülten ({fixtures.length})
                </button>
                <button onClick={() => setActiveTab('canli')} className={`py-2.5 px-2 border-b-2 whitespace-nowrap flex items-center space-x-1.5 ${activeTab === 'canli' ? 'border-red-500 text-red-500 font-bold' : 'border-transparent text-gray-400'}`}>
                  <Icons.Live />
                  <span>Şu An Canlı ({fixtures.filter(f => f.isLive).length})</span>
                </button>
                {isLoggedIn && (
                  <button onClick={() => setActiveTab('kuponlarim')} className={`py-2.5 px-2 border-b-2 whitespace-nowrap ${activeTab === 'kuponlarim' ? 'border-nesine-yellow text-nesine-yellow' : 'border-transparent text-gray-400'}`}>
                    🎟️ Kuponlarım ({betsHistory.length})
                  </button>
                )}
              </div>
            </nav>
          </header>

          {/* İÇERİK */}
          <main className="max-w-[1600px] mx-auto w-full px-2 sm:px-4 py-4 flex-1">
            <div className="lg:grid lg:grid-cols-12 lg:gap-4 items-start">
              
              {/* SOL SÜTUN: LİG KATEGORİLERİ */}
              <aside className="hidden lg:block lg:col-span-3 space-y-3 sticky top-24">
                <div className="bg-nesine-card rounded-lg border border-nesine-border p-3 max-h-[80vh] overflow-y-auto">
                  <h3 className="text-xs font-bold uppercase text-gray-400 mb-3 border-b border-nesine-border pb-1">Kategorize Ligler</h3>
                  
                  <button
                    onClick={() => setSelectedLeague('all')}
                    className={`w-full text-left px-2.5 py-1.5 rounded mb-2 text-xs font-bold flex justify-between ${selectedLeague === 'all' ? 'bg-nesine-yellow text-black' : 'bg-nesine-subcard text-gray-200'}`}
                  >
                    <span>Tüm Karşılaşmalar</span>
                    <span>{fixtures.length}</span>
                  </button>

                  {LEAGUE_CATEGORIES.map((cat, idx) => (
                    <div key={idx} className="mb-3 space-y-1">
                      <div className="text-[11px] font-extrabold text-nesine-yellow uppercase px-1">{cat.category}</div>
                      {cat.leagues.map(lg => {
                        const count = fixtures.filter(f => f.league === lg.id).length;
                        return (
                          <button
                            key={lg.id}
                            onClick={() => setSelectedLeague(lg.id)}
                            className={`w-full text-left px-2 py-1 rounded text-xs flex justify-between ${selectedLeague === lg.id ? 'bg-nesine-yellow text-black font-bold' : 'text-gray-300 hover:bg-nesine-subcard'}`}
                          >
                            <span className="truncate">{lg.name}</span>
                            <span className="font-mono text-[10px] opacity-75">{count}</span>
                          </button>
                        );
                      })}
                    </div>
                  ))}
                </div>
              </aside>

              {/* ORTA SÜTUN: BÜLTEN */}
              <section className="lg:col-span-6 space-y-3">
                {activeTab === 'kuponlarim' && isLoggedIn ? (
                  <div className="bg-nesine-card p-4 rounded-lg border border-nesine-border space-y-3">
                    <h2 className="text-base font-extrabold text-white">Kuponlarım ({betsHistory.length})</h2>
                    {betsHistory.map(b => (
                      <div key={b.id} className="bg-nesine-subcard p-3 rounded border border-nesine-border text-xs space-y-2">
                        <div className="flex justify-between text-gray-400"><span>Saat: {b.date}</span><span className="text-nesine-yellow font-bold">{b.status}</span></div>
                        {b.selections.map((s, idx) => (
                          <div key={idx} className="flex justify-between text-gray-200"><span>[{s.matchCode}] {s.home} - {s.away} ({s.market}: {s.oddName})</span><span className="font-mono text-nesine-yellow font-bold">{s.oddValue.toFixed(2)}</span></div>
                        ))}
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="space-y-2">
                    {isLoading ? (
                      <div className="bg-nesine-card p-8 rounded text-center text-xs text-gray-400">
                        📡 ESPN Canlı Maç Verileri Yükleniyor...
                      </div>
                    ) : filteredFixtures.length === 0 ? (
                      <div className="bg-nesine-card p-8 rounded text-center text-xs text-gray-400 space-y-2">
                        <div>🏟️ Seçili ligde şu an oynanan veya yaklaşan maç bulunamadı.</div>
                        <div className="text-[11px] text-gray-500">Sol menüden "Tüm Karşılaşmalar"ı seçebilirsiniz.</div>
                      </div>
                    ) : (
                      filteredFixtures.map(match => (
                        <div key={match.id} className="bg-nesine-card rounded-lg border border-nesine-border p-3">
                          <div className="flex items-center justify-between text-[11px] text-gray-400 mb-2 border-b border-nesine-border pb-1">
                            <div className="flex items-center space-x-2">
                              <span className="bg-nesine-subcard text-white px-1.5 py-0.5 rounded font-mono font-bold">{match.code}</span>
                              <span className="text-gray-300 font-semibold">{match.leagueName}</span>
                            </div>
                            <div>{match.isLive ? <span className="text-red-500 font-bold">CANLI {match.minute}</span> : <span>{match.time}</span>}</div>
                          </div>

                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div className="flex-1 cursor-pointer" onClick={() => setDetailModalMatch(match)}>
                              <div className="flex items-center space-x-4">
                                <div className="space-y-1 text-sm font-bold text-white">
                                  <div>{match.home}</div>
                                  <div>{match.away}</div>
                                </div>
                                {match.scoreHome !== null && (
                                  <div className="bg-black/80 px-2.5 py-1 rounded border border-nesine-border font-mono text-base font-extrabold text-nesine-yellow">
                                    {match.scoreHome} - {match.scoreAway}
                                  </div>
                                )}
                              </div>
                            </div>

                            <div className="grid grid-cols-4 gap-1 text-center font-mono text-xs">
                              <button onClick={() => handleToggleOdd(match, 'Maç Sonucu', '1', match.odds.ms1)} className={`p-2 rounded border ${selectedBetSlip.some(s => s.matchId === match.id && s.oddName === '1') ? 'bg-nesine-yellow text-black font-extrabold' : 'bg-nesine-subcard text-gray-200 border-nesine-border'}`}>MS 1<br/>{match.odds.ms1.toFixed(2)}</button>
                              <button onClick={() => handleToggleOdd(match, 'Maç Sonucu', 'X', match.odds.msX)} className={`p-2 rounded border ${selectedBetSlip.some(s => s.matchId === match.id && s.oddName === 'X') ? 'bg-nesine-yellow text-black font-extrabold' : 'bg-nesine-subcard text-gray-200 border-nesine-border'}`}>MS X<br/>{match.odds.msX.toFixed(2)}</button>
                              <button onClick={() => handleToggleOdd(match, 'Maç Sonucu', '2', match.odds.ms2)} className={`p-2 rounded border ${selectedBetSlip.some(s => s.matchId === match.id && s.oddName === '2') ? 'bg-nesine-yellow text-black font-extrabold' : 'bg-nesine-subcard text-gray-200 border-nesine-border'}`}>MS 2<br/>{match.odds.ms2.toFixed(2)}</button>
                              <button onClick={() => setDetailModalMatch(match)} className="p-2 rounded border bg-[#242424] text-gray-300 border-nesine-border">Tümü<br/>+14</button>
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                )}
              </section>

              {/* SAĞ SÜTUN: KUPON */}
              <aside className="hidden lg:block lg:col-span-3 sticky top-24">
                <div className="bg-nesine-card rounded-lg border border-nesine-border shadow-xl p-3 space-y-3">
                  <div className="flex justify-between items-center border-b border-nesine-border pb-2">
                    <span className="font-extrabold text-white text-sm">KUPONUM ({selectedBetSlip.length})</span>
                  </div>
                  {selectedBetSlip.map(item => (
                    <div key={item.matchId} className="bg-nesine-subcard p-2 rounded text-xs flex justify-between">
                      <span>[{item.matchCode}] {item.home}-{item.away}</span>
                      <span className="text-nesine-yellow font-bold">{item.oddValue.toFixed(2)}</span>
                    </div>
                  ))}
                  {selectedBetSlip.length > 0 && (
                    <button onClick={handlePlaceBet} className="w-full bg-nesine-yellow text-black font-black py-2.5 rounded text-sm uppercase">
                      KUPONU OYNA ({potentialPayout} CC)
                    </button>
                  )}
                </div>
              </aside>

            </div>
          </main>

          {/* AUTH MODAL */}
          {authModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-[#1A1A1A] max-w-md w-full rounded-xl border border-nesine-border p-5 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-nesine-border pb-3">
                  <h3 className="font-extrabold text-white text-base">Giriş Yap / Kayıt Ol</h3>
                  {isLoggedIn && <button onClick={() => setAuthModalOpen(false)} className="text-gray-400">✕</button>}
                </div>

                {!isLoggedIn && (
                  <div className="bg-yellow-950/40 border border-yellow-700/50 p-2.5 rounded text-[11px] text-yellow-300">
                    ⚠️ BetCore'da bülteni görüntülemek, bakiye kazanmak ve kupon yapabilmek için önce kullanıcı hesabı oluşturmalı veya var olan hesabınızla giriş yapmalısınız.
                  </div>
                )}

                {authMessage && (
                  <div className="bg-red-950 border border-red-800 text-red-300 p-2 rounded text-xs font-bold">
                    {authMessage}
                  </div>
                )}

                <div className="flex border-b border-nesine-border text-xs font-bold">
                  <button onClick={() => setAuthTab('login')} className={`flex-1 py-2 text-center border-b-2 ${authTab === 'login' ? 'border-nesine-yellow text-nesine-yellow' : 'border-transparent text-gray-400'}`}>Giriş Yap</button>
                  <button onClick={() => setAuthTab('register')} className={`flex-1 py-2 text-center border-b-2 ${authTab === 'register' ? 'border-nesine-yellow text-nesine-yellow' : 'border-transparent text-gray-400'}`}>Kayıt Ol</button>
                </div>

                {authTab === 'login' ? (
                  <form onSubmit={handleLogin} className="space-y-3 text-xs">
                    <input type="text" value={authUsernameInput} onChange={e => setAuthUsernameInput(e.target.value)} placeholder="Kullanıcı Adı" className="w-full bg-[#121212] border border-nesine-border rounded p-2 text-white outline-none" />
                    <input type="password" value={authPasswordInput} onChange={e => setAuthPasswordInput(e.target.value)} placeholder="Şifre" className="w-full bg-[#121212] border border-nesine-border rounded p-2 text-white outline-none" />
                    <button type="submit" className="w-full bg-nesine-yellow text-black font-black py-2.5 rounded text-sm uppercase">GİRİŞ YAP</button>
                  </form>
                ) : (
                  <form onSubmit={handleRegister} className="space-y-3 text-xs">
                    <input type="text" value={authUsernameInput} onChange={e => setAuthUsernameInput(e.target.value)} placeholder="Yeni Kullanıcı Adı" className="w-full bg-[#121212] border border-nesine-border rounded p-2 text-white outline-none" />
                    <input type="password" value={authPasswordInput} onChange={e => setAuthPasswordInput(e.target.value)} placeholder="Şifre" className="w-full bg-[#121212] border border-nesine-border rounded p-2 text-white outline-none" />
                    <p className="text-[10px] text-gray-400">* Kayıt olan her yeni hesaba anında 10,000 Core Coins verilir.</p>
                    <button type="submit" className="w-full bg-green-600 text-white font-black py-2.5 rounded text-sm uppercase">KAYIT OL VE BAŞLA</button>
                  </form>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
