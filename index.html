  <!-- Tailwind CSS CDN -->

    tailwind.config = {

  <!-- React 18, ReactDOM, Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    body {

      background-color: #141414;
      color: #D1D5DB;

<body class="bg-[#141414] text-gray-200 antialiased selection:bg-[#F5B400] selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SES MOTORU (Web Audio API) ---
    const playChime = (type = 'click') => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'goal') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'bet') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
          osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.06);
        }
      } catch (e) {}
    };

    // --- LİG HARİTASI (Nesine Tarzı Menü & Gruplama) ---
    const LEAGUE_GROUPS = [
      {
        category: "TÜRKİYE",
        leagues: [
          { id: 'tur.1', name: 'Trendyol Süper Lig', country: 'Türkiye', flag: '🇹🇷' },
          { id: 'tur.2', name: 'Trendyol 1. Lig', country: 'Türkiye', flag: '🇹🇷' }
        ]
      },
      {
        category: "İNGİLTERE",
        leagues: [
          { id: 'eng.1', name: 'Premier League', country: 'İngiltere', flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' },
          { id: 'eng.2', name: 'Championship', country: 'İngiltere', flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' }
        ]
      },
      {
        category: "İSPANYA",
        leagues: [
          { id: 'esp.1', name: 'La Liga', country: 'İspanya', flag: '🇪🇸' },
          { id: 'esp.2', name: 'La Liga 2', country: 'İspanya', flag: '🇪🇸' }
        ]
      },
      {
        category: "İTALYA",
        leagues: [
          { id: 'ita.1', name: 'Serie A', country: 'İtalya', flag: '🇮🇹' }
        ]
      },
      {
        category: "ALMANYA",
        leagues: [
          { id: 'ger.1', name: 'Bundesliga', country: 'Almanya', flag: '🇩🇪' }
        ]
      },
      {
        category: "FRANSA",
        leagues: [
          { id: 'fra.1', name: 'Ligue 1', country: 'Fransa', flag: '🇫🇷' }
        ]
      },
      {
        category: "AVRUPA KUPALARI",
        leagues: [
          { id: 'uefa.champions', name: 'Şampiyonlar Ligi', country: 'UEFA', flag: '🇪🇺' },
          { id: 'uefa.europa', name: 'Avrupa Ligi', country: 'UEFA', flag: '🇪🇺' }
        ]
      }
    ];

    const ALL_LEAGUES = LEAGUE_GROUPS.flatMap(g => g.leagues);

    // Açık spor verisi için yedekli proxy motoru
    async function fetchWithResilientProxy(url) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);
      try {
        const directRes = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (directRes.ok) return await directRes.json();
      } catch (err) {
        clearTimeout(timeoutId);
      }
      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const pRes = await fetch(proxyUrl);
        if (pRes.ok) return await pRes.json();
      } catch (err) {}
      return null;
    }

    function App() {
      // ================= KULLANICI & BAKİYE YÖNETİMİ =================
      const [usersDb, setUsersDb] = useState(() => {
        try {
          const saved = localStorage.getItem('betcore_users_db');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        // Varsayılan hazır oturum
        const todayStr = new Date().toISOString().slice(0, 10);
        return {
          'Oyuncu_Core': {
            password: '123',
            coins: 5000, // Kayıt Bonusu 5000 CC
            history: [],
            lastDailyBonusDate: todayStr,
            createdAt: new Date().toLocaleDateString('tr-TR')
          }
        };
      });

      const [activeUsername, setActiveUsername] = useState(() => {
        return localStorage.getItem('betcore_active_session') || 'Oyuncu_Core';
      });

      const [soundEnabled, setSoundEnabled] = useState(true);
      const [dailyBonusClaimed, setDailyBonusClaimed] = useState(false);

      // Aktif kullanıcı profili
      const currentUser = usersDb[activeUsername] || {
        password: '123',
        coins: 5000,
        history: [],
        lastDailyBonusDate: '',
        createdAt: new Date().toLocaleDateString('tr-TR')
      };

      const coins = currentUser.coins;
      const betsHistory = currentUser.history || [];

      // ================= GÜNLÜK GİRİŞ BONUSU KONTROLÜ (200 CC) =================
      useEffect(() => {
        if (!activeUsername || !usersDb[activeUsername]) return;
        const todayStr = new Date().toISOString().slice(0, 10);
        const user = usersDb[activeUsername];

        if (user.lastDailyBonusDate !== todayStr) {
          const updatedCoins = user.coins + 200;
          const updatedDb = {
            ...usersDb,
            [activeUsername]: {
              ...user,
              coins: updatedCoins,
              lastDailyBonusDate: todayStr
            }
          };
          setUsersDb(updatedDb);
          localStorage.setItem('betcore_users_db', JSON.stringify(updatedDb));
          setDailyBonusClaimed(true);
          playChime('bet');
          setTimeout(() => setDailyBonusClaimed(false), 6000);
        }
      }, [activeUsername]);

      // State değişimlerini anında localStorage'a kaydet
      useEffect(() => {
        localStorage.setItem('betcore_users_db', JSON.stringify(usersDb));
      }, [usersDb]);

      useEffect(() => {
        localStorage.setItem('betcore_active_session', activeUsername);
      }, [activeUsername]);

      // ================= BÜLTEN & MAÇ YÖNETİMİ =================
      const [fixtures, setFixtures] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [selectedLeagueId, setSelectedLeagueId] = useState('all');
      const [activeTab, setActiveTab] = useState('bulten'); // 'bulten' | 'canli' | 'kuponlarim' | 'kupondas'
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedBetSlip, setSelectedBetSlip] = useState([]);
      const [slipStake, setSlipStake] = useState(50);
      const [mobileSlipOpen, setMobileSlipOpen] = useState(false);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authTab, setAuthTab] = useState('login');
      const [authUsername, setAuthUsername] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [pollSeconds, setPollSeconds] = useState(60);

      // ================= GERÇEK MAÇLARI ÇEKME =================
      const fetchFixtures = async () => {
        setIsLoading(true);
        try {
          const endpointsToFetch = [
            { code: 'tur.1', id: 'tur.1', name: 'Trendyol Süper Lig', flag: '🇹🇷' },
            { code: 'tur.2', id: 'tur.2', name: 'Trendyol 1. Lig', flag: '🇹🇷' },
            { code: 'eng.1', id: 'eng.1', name: 'Premier League', flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' },
            { code: 'esp.1', id: 'esp.1', name: 'La Liga', flag: '🇪🇸' },
            { code: 'ita.1', id: 'ita.1', name: 'Serie A', flag: '🇮🇹' },
            { code: 'ger.1', id: 'ger.1', name: 'Bundesliga', flag: '🇩🇪' },
            { code: 'fra.1', id: 'fra.1', name: 'Ligue 1', flag: '🇫🇷' },
            { code: 'uefa.champions', id: 'uefa.champions', name: 'Şampiyonlar Ligi', flag: '🇪🇺' }
          ];

          const requests = endpointsToFetch.map(async (lg) => {
            const url = `https://site.api.espn.com/apis/site/v2/sports/soccer/${lg.code}/scoreboard`;
            const data = await fetchWithResilientProxy(url);
            if (!data || !data.events) return [];

            return data.events.map((ev, idx) => {
              const comp = ev.competitions?.[0];
              const home = comp?.competitors?.find(c => c.homeAway === 'home');
              const away = comp?.competitors?.find(c => c.homeAway === 'away');
              const statusState = ev.status?.type?.state;
              const isLive = statusState === 'in';
              const isFinished = statusState === 'post';

              let timeStr = "20:00";
              let minuteStr = null;
              if (isLive) {
                timeStr = "CANLI";
                minuteStr = ev.status?.displayClock ? `${ev.status.displayClock}'` : (ev.status?.type?.detail || "CANLI");
              } else if (isFinished) {
                timeStr = "MS";
                minuteStr = "Bitti";
              } else {
                try {
                  timeStr = new Date(ev.date).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                } catch (e) {}
              }

              const sHome = (home?.score !== undefined && home?.score !== null && home?.score !== "") ? parseInt(home.score) : null;
              const sAway = (away?.score !== undefined && away?.score !== null && away?.score !== "") ? parseInt(away.score) : null;

              // Deterministik Nesine Maç Kodu (Örn: 48212)
              const numericCode = (parseInt(ev.id) || (idx + 100)) % 9000 + 10000;

              return {
                id: ev.id || `${lg.id}_${idx}`,
                code: numericCode.toString(),
                leagueId: lg.id,
                leagueName: lg.name,
                flag: lg.flag,
                time: timeStr,
                minute: minuteStr,
                isLive,
                isFinished,
                home: home?.team?.displayName || "Ev Sahibi",
                away: away?.team?.displayName || "Deplasman",
                scoreHome: sHome,
                scoreAway: sAway,
                odds: {
                  ms1: +(2.05 + ((idx % 7) * 0.12)).toFixed(2),
                  msX: +(3.10 + ((idx % 5) * 0.08)).toFixed(2),
                  ms2: +(2.85 + ((idx % 6) * 0.15)).toFixed(2),
                  alt25: 1.82,
                  ust25: 1.76,
                  kgVar: 1.64,
                  kgYok: 1.95
                }
              };
            });
          });

          const results = await Promise.all(requests);
          setFixtures(results.flat());
        } catch (err) {
          console.warn("Bülten verisi yüklenirken hata:", err);
        } finally {
          setIsLoading(false);
          setPollSeconds(60);
        }
      };

      useEffect(() => {
        fetchFixtures();
        const timer = setInterval(() => {
          setPollSeconds(prev => {
            if (prev <= 1) {
              fetchFixtures();
              return 60;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // ================= KUPON SEÇİMİ =================
      const toggleOdd = (match, marketName, oddName, oddValue) => {
        if (soundEnabled) playChime('click');
        setSelectedBetSlip(prev => {
          const existingIdx = prev.findIndex(item => item.matchId === match.id);
          if (existingIdx > -1 && prev[existingIdx].oddName === oddName && prev[existingIdx].market === marketName) {
            return prev.filter((_, idx) => idx !== existingIdx);
          }
          const newItem = {
            matchId: match.id,
            matchCode: match.code,
            leagueName: match.leagueName,
            home: match.home,
            away: match.away,
            market: marketName,
            oddName,
            oddValue: parseFloat(oddValue)
          };
          if (existingIdx > -1) {
            const updated = [...prev];
            updated[existingIdx] = newItem;
            return updated;
          }
          return [...prev, newItem];
        });
      };

      const totalOdds = useMemo(() => {
        if (selectedBetSlip.length === 0) return "0.00";
        return selectedBetSlip.reduce((acc, item) => acc * item.oddValue, 1).toFixed(2);
      }, [selectedBetSlip]);

      const potentialPayout = useMemo(() => {
        return (parseFloat(totalOdds) * slipStake).toFixed(2);
      }, [totalOdds, slipStake]);

      // ================= KUPON YATIRMA MOTORU (GARANTİLİ VE KESİN KAYIT) =================
      const handlePlaceBet = () => {
        if (selectedBetSlip.length === 0) {
          alert("Lütfen kuponunuza en az 1 karşılaşma ekleyin.");
          return;
        }

        if (coins < slipStake) {
          alert(`Yetersiz bakiye! Mevcut Bakiyeniz: ${coins} CC. Lütfen misli tutarını düşürün.`);
          return;
        }

        const newBet = {
          id: 'KP_' + Date.now().toString().slice(-6),
          date: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
          stake: parseFloat(slipStake),
          totalOdds: parseFloat(totalOdds),
          potentialPayout: parseFloat(potentialPayout),
          status: 'Devam Ediyor',
          canCashOut: true,
          cashOutValue: Math.floor(slipStake * 0.90),
          selections: [...selectedBetSlip]
        };

        const updatedHistory = [newBet, ...(currentUser.history || [])];
        const updatedCoins = coins - slipStake;

        const updatedDb = {
          ...usersDb,
          [activeUsername]: {
            ...currentUser,
            coins: updatedCoins,
            history: updatedHistory
          }
        };

        // Hem state'e hem localStorage'a anında doğrudan yaz
        setUsersDb(updatedDb);
        localStorage.setItem('betcore_users_db', JSON.stringify(updatedDb));

        setSelectedBetSlip([]);
        setMobileSlipOpen(false);
        if (soundEnabled) playChime('bet');

        alert(`Kuponunuz başarıyla kaydedildi!\nKupon No: ${newBet.id}\nOlası Kazanç: ${newBet.potentialPayout} CC\nKuponlarım sekmesinden takip edebilirsiniz.`);
        setActiveTab('kuponlarim');
      };

      // Kupon Bozdurma (Cash-Out)
      const handleCashOut = (betId) => {
        const bet = betsHistory.find(b => b.id === betId);
        if (!bet || !bet.canCashOut) return;

        if (confirm(`${bet.cashOutValue} Core Coins karşılığında kuponu hemen bozdurmak istiyor musunuz?`)) {
          const updatedCoins = coins + bet.cashOutValue;
          const updatedHistory = betsHistory.map(b => b.id === betId ? { ...b, status: 'Bozduruldu', canCashOut: false } : b);

          const updatedDb = {
            ...usersDb,
            [activeUsername]: {
              ...currentUser,
              coins: updatedCoins,
              history: updatedHistory
            }
          };

          setUsersDb(updatedDb);
          localStorage.setItem('betcore_users_db', JSON.stringify(updatedDb));
          if (soundEnabled) playChime('bet');
        }
      };

      // ================= KULLANICI GİRİŞ & KAYIT =================
      const submitAuth = (e) => {
        e.preventDefault();
        const uname = authUsername.trim();
        const pass = authPassword.trim();
        if (!uname || !pass) {
          setAuthError("Lütfen kullanıcı adı ve şifre girin.");
          return;
        }

        if (authTab === 'login') {
          const user = usersDb[uname];
          if (!user || user.password !== pass) {
            setAuthError("Hatalı kullanıcı adı veya şifre!");
            return;
          }
          setActiveUsername(uname);
          setAuthModalOpen(false);
          setAuthError('');
        } else {
          if (usersDb[uname]) {
            setAuthError("Bu kullanıcı adı zaten alınmış!");
            return;
          }
          const todayStr = new Date().toISOString().slice(0, 10);
          const newUser = {
            password: pass,
            coins: 5000, // 5000 CC Kayıt Bonusu
            history: [],
            lastDailyBonusDate: todayStr,
            createdAt: new Date().toLocaleDateString('tr-TR')
          };
          const updatedDb = { ...usersDb, [uname]: newUser };
          setUsersDb(updatedDb);
          setActiveUsername(uname);
          localStorage.setItem('betcore_users_db', JSON.stringify(updatedDb));
          setAuthModalOpen(false);
          setAuthError('');
          alert("Hesabınız oluşturuldu! 5.000 Core Coins kayıt bonusu hesabınıza aktarıldı.");
        }
      };

      // ================= LİG BAZINDA GRUPLAMA =================
      const groupedFixtures = useMemo(() => {
        const filtered = fixtures.filter(m => {
          const leagueMatch = selectedLeagueId === 'all' || m.leagueId === selectedLeagueId;
          const searchMatch = m.home.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              m.away.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              m.code.includes(searchQuery);
          const tabMatch = activeTab === 'canli' ? m.isLive : true;
          return leagueMatch && searchMatch && tabMatch;
        });

        // Lig ID'sine göre grupla
        const groups = {};
        filtered.forEach(m => {
          if (!groups[m.leagueId]) {
            groups[m.leagueId] = {
              name: m.leagueName,
              flag: m.flag,
              matches: []
            };
          }
          groups[m.leagueId].matches.push(m);
        });

        return groups;
      }, [fixtures, selectedLeagueId, searchQuery, activeTab]);

      return (
        <div className="min-h-screen flex flex-col bg-[#141414]">

          {/* GÜNLÜK GİRİŞ BONUSU BİLDİRİMİ */}
          {dailyBonusClaimed && (
            <div className="bg-[#28A745] text-black px-4 py-2 text-center text-xs font-bold border-b border-black flex items-center justify-center space-x-2">
              <span>🎁</span>
              <span>GÜNLÜK GİRİŞ BONUSU: 200 Core Coins hesabınıza başarıyla eklendi!</span>
            </div>
          )}

          {/* ================= NESİNE TARZI PORTAL HEADER ================= */}
          <header className="bg-[#1C1C1C] border-b border-[#2C2C2C] sticky top-0 z-40">
            {/* Üst İnce Bar */}
            <div className="max-w-[1400px] mx-auto px-2 sm:px-4 h-12 flex items-center justify-between">
              
              {/* Logo & Canlı Ticker */}
              <div className="flex items-center space-x-3">
                <div 
                  onClick={() => { setActiveTab('bulten'); setSelectedLeagueId('all'); }}
                  className="cursor-pointer flex items-center space-x-1 select-none"
                >
                  <div className="bg-[#F5B400] text-black font-black text-xl px-2 py-0.5 rounded-sm tracking-tighter">
                    BET
                  </div>
                  <span className="font-extrabold text-lg text-white tracking-tight">CORE</span>
                </div>

                <div className="hidden md:flex items-center space-x-1.5 text-[11px] text-gray-400 border-l border-[#333] pl-3">
                  <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                  <span>Canlı Bülten ({pollSeconds}s)</span>
                </div>
              </div>

              {/* Arama Kutusu */}
              <div className="flex-1 max-w-xs mx-4 hidden sm:block">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Maç kodu veya takım ara..."
                  className="w-full bg-[#121212] border border-[#333] text-gray-200 text-xs px-2.5 py-1.5 rounded-sm outline-none focus:border-[#F5B400]"
                />
              </div>

              {/* Bakiye, Ses & Kullanıcı Kutusu */}
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setSoundEnabled(!soundEnabled)}
                  title="Ses Aç/Kapat"
                  className="p-1.5 bg-[#252525] border border-[#333] text-gray-300 hover:text-white rounded-sm text-xs"
                >
                  {soundEnabled ? '🔔' : '🔕'}
                </button>

                {/* Bakiye Göstergesi */}
                <div 
                  onClick={() => {
                    if (confirm("Test bakiyesine 1.000 Core Coins eklemek istiyor musunuz?")) {
                      const updatedCoins = coins + 1000;
                      const updatedDb = { ...usersDb, [activeUsername]: { ...currentUser, coins: updatedCoins } };
                      setUsersDb(updatedDb);
                      localStorage.setItem('betcore_users_db', JSON.stringify(updatedDb));
                    }
                  }}
                  className="bg-[#242424] border border-[#3D3D3D] px-2.5 py-1 rounded-sm text-right cursor-pointer"
                  title="Tıkla ve Bakiye Ekle"
                >
                  <div className="text-[9px] text-gray-400 uppercase leading-none">Bakiye</div>
                  <div className="text-xs font-bold text-[#F5B400] font-mono leading-tight">
                    {coins.toLocaleString('tr-TR')} CC
                  </div>
                </div>

                {/* Giriş / Profil Butonu */}
                <button
                  onClick={() => setAuthModalOpen(true)}
                  className="bg-[#303030] hover:bg-[#3D3D3D] text-white border border-[#444] px-2.5 py-1.5 rounded-sm text-xs font-bold flex items-center space-x-1"
                >
                  <span>👤</span>
