  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- SES MOTORU (Web Audio API) ---
    const playChime = (type = 'click') => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'goal') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.6);
        } else if (type === 'cashout') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        }
      } catch (e) {
        console.warn("Ses motoru uyarısı:", e);
      }
    };

    // --- KATEGORİLENDİRİLMİŞ LİGLER LİSTESİ ---
    const LEAGUE_CATEGORIES = [
      {

          { id: 'championship', name: 'Championship', code: 'eng.2' }

      },
      {
        category: "İspanya",
        leagues: [
          { id: 'laliga', name: 'La Liga', code: 'esp.1' },

      {

      },
      {

      },
      {

        leagues: [
          { id: 'eredivisie', name: 'Eredivisie', code: 'ned.1' },
          { id: 'primeira', name: 'Primeira Liga', code: 'por.1' },
          { id: 'brasileirao', name: 'Série A (Brezilya)', code: 'bra.1' }
        ]
      },
      {
        category: "UEFA Turnuvaları",
        leagues: [
          { id: 'champions', name: 'Şampiyonlar Ligi', code: 'uefa.champions' },
          { id: 'europa', name: 'Avrupa Ligi', code: 'uefa.europa' },
          { id: 'conference', name: 'Konferans Ligi', code: 'uefa.europa.conf' },
          { id: 'nations', name: 'Uluslar Ligi', code: 'uefa.nations' }
        ]
      }

    const ALL_LEAGUES = LEAGUE_CATEGORIES.flatMap(cat => cat.leagues);

    // =========================================================================
    // ÇOK KATMANLI CORS & VEKİL SUNUCU (PROXY) MOTORU - GITHUB PAGES UYUMLU
    // =========================================================================
    async function fetchWithResilientProxy(url) {
      // 1. Doğrudan Açık Endpoint İstemi (Zaman aşımı korumalı)
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4500);
      try {
        const directRes = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (directRes.ok) return await directRes.json();
      } catch (err) {
        clearTimeout(timeoutId);
      }

      // 2. Birincil CORS Proxy: allorigins.win
      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const pRes = await fetch(proxyUrl);
        if (pRes.ok) return await pRes.json();
      } catch (err) {}

      // 3. İkincil CORS Proxy: corsproxy.io
      try {
        const proxyUrl2 = `https://corsproxy.io/?${encodeURIComponent(url)}`;
        const pRes2 = await fetch(proxyUrl2);
        if (pRes2.ok) return await pRes2.json();
      } catch (err) {}

      return null;
    }

    function App() {
      // ================= 1. HESAP, OTURUM & PERSISTENCE =================
      const [usersDb, setUsersDb] = useState(() => {
        try {
          const saved = localStorage.getItem('betcore_users_db');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return {};
      });

      // Giriş yapılmış aktif kullanıcı (varsayılan boş: oturum açılmadı)
      const [activeUsername, setActiveUsername] = useState(() => {
        return localStorage.getItem('betcore_active_session') || '';
      });

      const isAuthenticated = Boolean(activeUsername && usersDb[activeUsername]);
      const currentUser = isAuthenticated ? usersDb[activeUsername] : null;
      const coins = currentUser ? currentUser.coins : 0;
      const betsHistory = currentUser ? currentUser.history : [];

      useEffect(() => {
        localStorage.setItem('betcore_users_db', JSON.stringify(usersDb));
      }, [usersDb]);

      useEffect(() => {
        if (activeUsername) {
          localStorage.setItem('betcore_active_session', activeUsername);
        } else {
          localStorage.removeItem('betcore_active_session');
        }
      }, [activeUsername]);

      const updateUserCoins = (newCoins) => {
        if (!activeUsername) return;
        setUsersDb(prev => ({
          ...prev,
          [activeUsername]: {
            ...prev[activeUsername],
            coins: newCoins
          }
        }));
      };

      const updateUserHistory = (newHistory) => {
        if (!activeUsername) return;
        setUsersDb(prev => ({
          ...prev,
          [activeUsername]: {
            ...prev[activeUsername],
            history: newHistory
          }
        }));
      };

      // Ses Tercihi
      const [soundEnabled, setSoundEnabled] = useState(() => {
        const saved = localStorage.getItem('betcore_sound');
        return saved !== null ? JSON.parse(saved) : true;
      });
      useEffect(() => {
        localStorage.setItem('betcore_sound', JSON.stringify(soundEnabled));
      }, [soundEnabled]);

      // ================= 2. %100 GERÇEK MAÇ VERİLERİ (SIFIR SİMÜLASYON) =================
      const [fixtures, setFixtures] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [fetchError, setFetchError] = useState(null);
      const [lastUpdated, setLastUpdated] = useState(new Date());
      const [pollSecondsLeft, setPollSecondsLeft] = useState(60);

      // UI Durumları
      const [activeTab, setActiveTab] = useState('bulten');
      const [selectedLeague, setSelectedLeague] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedBetSlip, setSelectedBetSlip] = useState([]);
      const [slipStake, setSlipStake] = useState(100);
      const [mobileSlipOpen, setMobileSlipOpen] = useState(false);
      const [detailModalMatch, setDetailModalMatch] = useState(null);
      const [goalToast, setGoalToast] = useState(null);

      // Auth Modalı Durumları
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authTab, setAuthTab] = useState('login'); // 'login' | 'register' | 'sync'
      const [authUsernameInput, setAuthUsernameInput] = useState('');
      const [authPasswordInput, setAuthPasswordInput] = useState('');
      const [syncCodeInput, setSyncCodeInput] = useState('');
      const [authMessage, setAuthMessage] = useState(null);

      // ================= RESILIENT GERÇEK MAÇ ÇEKME İŞLEMİ =================
      const fetchRealFixtures = async () => {
        setIsLoading(true);
        setFetchError(null);

        try {
          // Hem dünya geneli canlı akışı hem de popüler ligleri eşzamanlı çek
          const endpointsToQuery = [
            { id: 'global_live', name: 'Canlı Karşılaşmalar', code: 'all' },
            ...ALL_LEAGUES.slice(0, 10) // Performans ve hızlı yanıt için öncelikli ligler
          ];

          const requests = endpointsToQuery.map(async (lg) => {
            const url = `https://site.api.espn.com/apis/site/v2/sports/soccer/${lg.code}/scoreboard`;
            const data = await fetchWithResilientProxy(url);
            if (!data || !data.events || data.events.length === 0) return [];

            return data.events.map((ev, index) => {
              const comp = ev.competitions?.[0];
              const homeTeam = comp?.competitors?.find(c => c.homeAway === 'home');
              const awayTeam = comp?.competitors?.find(c => c.homeAway === 'away');
              const statusState = ev.status?.type?.state;
              const isLive = statusState === 'in';
              const isFinished = statusState === 'post';

              let matchTime = "20:00";
              let minute = null;
              if (isLive) {
                matchTime = "CANLI";
                minute = ev.status?.displayClock ? `${ev.status.displayClock}'` : (ev.status?.type?.detail || "CANLI");
              } else if (isFinished) {
                matchTime = "MS";
                minute = "Bitti";
              } else {
                try {
                  matchTime = new Date(ev.date).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                } catch (e) {
                  matchTime = "Bültende";
                }
              }

              const sHome = (homeTeam?.score !== undefined && homeTeam?.score !== null && homeTeam?.score !== "")
                ? parseInt(homeTeam.score) : null;
              const sAway = (awayTeam?.score !== undefined && awayTeam?.score !== null && awayTeam?.score !== "")
                ? parseInt(awayTeam.score) : null;

              // Dinamik gerçekçi oranlar
              let oddsData = {
                ms1: 2.15, msX: 3.30, ms2: 2.95,
                alt25: 1.85, ust25: 1.75,
                kgVar: 1.62, kgYok: 2.05,
                iy1: 2.70, iyX: 2.05, iy2: 3.40
              };

              if (isLive && sHome !== null && sAway !== null) {
                if (sHome > sAway) {
                  oddsData.ms1 = 1.22; oddsData.msX = 4.40; oddsData.ms2 = 8.50;
                } else if (sAway > sHome) {
                  oddsData.ms1 = 7.50; oddsData.msX = 4.20; oddsData.ms2 = 1.30;
                } else {
                  oddsData.ms1 = 2.45; oddsData.msX = 2.30; oddsData.ms2 = 2.65;
                }
              }

              const numericId = parseInt(ev.id) || (index + 400);
              const matchCode = (100 + (numericId % 899)).toString();

              // Lig eşleştirmesi
              const matchedLeague = ALL_LEAGUES.find(l => l.code === lg.code) || {
                id: lg.id,
                name: comp?.league?.name || ev.league?.name || lg.name
              };

              return {
                id: ev.id || `espn_${matchedLeague.id}_${index}`,
                code: matchCode,
                league: matchedLeague.id,
                leagueName: matchedLeague.name,
                dateFormatted: new Date(ev.date).toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit' }),
                time: matchTime,
                minute: minute,
                isLive: isLive,
                isFinished: isFinished,
                home: homeTeam?.team?.displayName || "Ev Sahibi",
                away: awayTeam?.team?.displayName || "Deplasman",
                homeLogo: homeTeam?.team?.logo || null,
                awayLogo: awayTeam?.team?.logo || null,
                scoreHome: sHome,
                scoreAway: sAway,
                odds: oddsData,
                trend: {}
              };
            });
          });

          const results = await Promise.all(requests);
          const flatMatches = results.flat();

          // Tekilleştirme (Duplicate id koruması)
          const seen = new Set();
          const uniqueMatches = [];
          for (const m of flatMatches) {
            if (!seen.has(m.id)) {
              seen.add(m.id);
              uniqueMatches.push(m);
            }
          }

          // Gol bildirim kontrolü
          uniqueMatches.forEach(newM => {
            if (newM.isLive) {
              const oldM = fixtures.find(f => f.id === newM.id);
              if (oldM && oldM.isLive) {
                if (newM.scoreHome > oldM.scoreHome) {
                  triggerGoalToast(newM, newM.home, newM.scoreHome, newM.scoreAway);
                } else if (newM.scoreAway > oldM.scoreAway) {
                  triggerGoalToast(newM, newM.away, newM.scoreHome, newM.scoreAway);
                }
              }
            }
          });

          setFixtures(uniqueMatches);
          setLastUpdated(new Date());
        } catch (error) {
          console.error("Fikstür yükleme hatası:", error);
          setFetchError("Canlı veri ağ bağlantısı yeniden deneniyor...");
        } finally {
          setIsLoading(false);
          setPollSecondsLeft(60);
        }
      };

      // 60 Saniye Polling Sayacı
      useEffect(() => {
        fetchRealFixtures();
        const interval = setInterval(() => {
          setPollSecondsLeft(prev => {
            if (prev <= 1) {
              fetchRealFixtures();
              return 60;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      const triggerGoalToast = (match, team, hScore, aScore) => {
        if (soundEnabled) playChime('goal');
        setGoalToast({
          matchCode: match.code,
          text: `GOL! ${team} fileleri havalandırdı! (${match.home} ${hScore} - ${aScore} ${match.away})`
        });
        setTimeout(() => setGoalToast(null), 5000);
      };

      const handleToggleOdd = (match, marketName, oddName, oddValue) => {
        if (soundEnabled) playChime('click');
        setSelectedBetSlip(prev => {
          const existingIndex = prev.findIndex(item => item.matchId === match.id);
          if (existingIndex > -1 && prev[existingIndex].oddName === oddName && prev[existingIndex].market === marketName) {
            return prev.filter((_, idx) => idx !== existingIndex);
          }
          const newItem = {
            matchId: match.id,
            matchCode: match.code,
            home: match.home,
            away: match.away,
            market: marketName,
            oddName,
            oddValue: parseFloat(oddValue)
          };
          if (existingIndex > -1) {
            const updated = [...prev];
            updated[existingIndex] = newItem;
            return updated;
          }
          return [...prev, newItem];
        });
      };

      const totalOdds = useMemo(() => {
        if (selectedBetSlip.length === 0) return 0;
        return selectedBetSlip.reduce((acc, item) => acc * item.oddValue, 1).toFixed(2);
      }, [selectedBetSlip]);

      const potentialPayout = useMemo(() => {
        return (totalOdds * slipStake).toFixed(0);
      }, [totalOdds, slipStake]);

      // ================= ZORUNLU GİRİŞ VE BAHİS YATIRMA =================
      const handlePlaceBet = () => {
        // 1. ZORUNLU GİRİŞ KONTROLÜ
        if (!isAuthenticated) {
          setAuthModalOpen(true);
          setAuthTab('login');
          setAuthMessage({ type: 'error', text: 'Kupon yatırmak için lütfen giriş yapın veya ücretsiz hesap oluşturun!' });
          return;
        }

        if (selectedBetSlip.length === 0) return alert("Kuponunuza en az bir maç ekleyin!");
        if (coins < slipStake) return alert("Yetersiz Core Coins! Bakiye kutusuna tıklayarak ücretsiz yükleyebilirsiniz.");

        const newBet = {
          id: 'bet_' + Date.now(),
          date: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
          stake: parseFloat(slipStake),
          totalOdds: parseFloat(totalOdds),
          potentialPayout: parseFloat(potentialPayout),
          selections: [...selectedBetSlip],
          status: 'Devam Ediyor',
          canCashOut: true,
          cashOutValue: Math.floor(slipStake * 0.92)
        };

        updateUserCoins(coins - slipStake);
        updateUserHistory([newBet, ...betsHistory]);
        setSelectedBetSlip([]);
        setMobileSlipOpen(false);
