    function h(type, props, ...children) {
      const flattened = [];
      for (let i = 0; i < children.length; i++) {
        const c = children[i];
        if (c === null || c === undefined || c === false) continue;
        if (Array.isArray(c)) {
          for (let j = 0; j < c.length; j++) {
            if (c[j] !== null && c[j] !== undefined && c[j] !== false) {
              flattened.push(c[j]);
            }
          }
        } else {
          flattened.push(c);
        }
      }
      return React.createElement(type, props || null, ...flattened);
    }

    const { useState, useEffect, useMemo, useRef } = React;

    // --- SES MOTORU (Web Audio API) ---
    const playChime = (type = 'click') => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'bet') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
          osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.06);
        }
      } catch (e) {}
    };

    // Açık spor verisi için yedekli CORS motoru
    async function fetchResilientJSON(url) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4500);
      try {
        const directRes = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (directRes.ok) return await directRes.json();
      } catch (err) {
        clearTimeout(timeoutId);
      }
      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const pRes = await fetch(proxyUrl);
        if (pRes.ok) return await pRes.json();
      } catch (err) {}
      return null;
    }

    function App() {
      const todayStr = new Date().toISOString().slice(0, 10);

      // ================= KULLANICI & BAKİYE =================
      const [usersDb, setUsersDb] = useState(() => {
        try {
          const saved = localStorage.getItem('betcore_db_v4');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return {
          'Oyuncu_Core': {
            password: '123',
            coins: 5000,
            history: [],
            lastDailyBonusDate: todayStr
          }
        };
      });

      const [activeUsername, setActiveUsername] = useState(() => {
        return localStorage.getItem('betcore_session_v4') || 'Oyuncu_Core';
      });

      const [dailyClaimedNotice, setDailyClaimedNotice] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);

      const currentUser = usersDb[activeUsername] || {
        password: '123',
        coins: 5000,
        history: [],
        lastDailyBonusDate: ''
      };

      const coins = currentUser.coins;
      const betsHistory = currentUser.history || [];

      // Günlük 200 CC Giriş Bonusu
      useEffect(() => {
        if (!activeUsername || !usersDb[activeUsername]) return;
        const user = usersDb[activeUsername];

        if (user.lastDailyBonusDate !== todayStr) {
          const updatedCoins = user.coins + 200;
          const updatedDb = {
            ...usersDb,
            [activeUsername]: {
              ...user,
              coins: updatedCoins,
              lastDailyBonusDate: todayStr
            }
          };
          setUsersDb(updatedDb);
          localStorage.setItem('betcore_db_v4', JSON.stringify(updatedDb));
          setDailyClaimedNotice(true);
          playChime('bet');
          setTimeout(() => setDailyClaimedNotice(false), 5000);
        }
      }, [activeUsername]);

      useEffect(() => {
        localStorage.setItem('betcore_db_v4', JSON.stringify(usersDb));
      }, [usersDb]);

      useEffect(() => {
        localStorage.setItem('betcore_session_v4', activeUsername);
      }, [activeUsername]);

      // ================= BÜLTEN & CANLI VERİ =================
      const [fixtures, setFixtures] = useState(BASE_FIXTURES);
      const [isUpdating, setIsUpdating] = useState(false);
      const [pollSeconds, setPollSeconds] = useState(60);
      const [lastUpdatedTime, setLastUpdatedTime] = useState(new Date().toLocaleTimeString('tr-TR'));

      // Kararlı Navigasyon Durumları
      const [selectedLeagueId, setSelectedLeagueId] = useState('all');
      const [activeTab, setActiveTab] = useState('bulten');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedBetSlip, setSelectedBetSlip] = useState([]);
      const [slipStake, setSlipStake] = useState(50);
      const [mobileSlipOpen, setMobileSlipOpen] = useState(false);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authTab, setAuthTab] = useState('login');
      const [authUsername, setAuthUsername] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authMsg, setAuthMsg] = useState('');

      // ================= 60 SANİYELİK GERÇEK VERİ YENİLEME MOTORU =================
      const refreshRealFixtures = async () => {
        setIsUpdating(true);
        try {
          const requests = ALL_LEAGUES.map(async (lg) => {
            const url = `https://site.api.espn.com/apis/site/v2/sports/soccer/${lg.code}/scoreboard`;
            const data = await fetchResilientJSON(url);
            if (!data || !data.events || data.events.length === 0) return [];

            return data.events.map((ev, idx) => {
              const comp = ev.competitions?.[0];
              const home = comp?.competitors?.find(c => c.homeAway === 'home');
              const away = comp?.competitors?.find(c => c.homeAway === 'away');
              const statusState = ev.status?.type?.state;
              const isLive = statusState === 'in';
              const isFinished = statusState === 'post';

              let timeStr = "20:00";
              let minuteStr = null;
              if (isLive) {
                timeStr = "CANLI";
                minuteStr = ev.status?.displayClock ? `${ev.status.displayClock}'` : (ev.status?.type?.detail || "CANLI");
              } else if (isFinished) {
                timeStr = "MS";
                minuteStr = "Bitti";
              } else {
                try {
                  timeStr = new Date(ev.date).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                } catch (e) {}
              }

              const sHome = (home?.score !== undefined && home?.score !== null && home?.score !== "") ? parseInt(home.score) : null;
              const sAway = (away?.score !== undefined && away?.score !== null && away?.score !== "") ? parseInt(away.score) : null;

              // Deterministik 5 Haneli Nesine Kodu
              const numericCode = (parseInt(ev.id) || (idx + 100)) % 9000 + 40000;

              return {
                id: ev.id || `${lg.id}_${idx}`,
                code: numericCode.toString(),
                leagueId: lg.id,
                leagueName: lg.name,
                flag: lg.flag,
                time: timeStr,
                minute: minuteStr,
                isLive,
                isFinished,
                home: home?.team?.displayName || "Ev Sahibi",
                away: away?.team?.displayName || "Deplasman",
                scoreHome: sHome,
                scoreAway: sAway,
                odds: {
                  ms1: +(2.05 + ((idx % 6) * 0.15)).toFixed(2),
                  msX: +(3.10 + ((idx % 4) * 0.10)).toFixed(2),
                  ms2: +(2.80 + ((idx % 5) * 0.18)).toFixed(2),
                  alt25: 1.82,
                  ust25: 1.76
                }
              };
            });
          });

          const results = await Promise.all(requests);
          const flatReal = results.flat();

          if (flatReal.length > 0) {
            setFixtures(flatReal);
          }
          setLastUpdatedTime(new Date().toLocaleTimeString('tr-TR'));
        } catch (e) {
          console.warn("Otomatik yenileme uyarısı:", e);
        } finally {
          setIsUpdating(false);
          setPollSeconds(60);
        }
      };

      // 60 Saniyelik Sayaç & Otomatik Tetikleme
      useEffect(() => {
        refreshRealFixtures();
        const timer = setInterval(() => {
          setPollSeconds(prev => {
            if (prev <= 1) {
              refreshRealFixtures();
              return 60;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // ================= KUPON İŞLEMLERİ =================
      const toggleOdd = (match, marketName, oddName, oddValue) => {
        if (soundEnabled) playChime('click');
        setSelectedBetSlip(prev => {
          const existingIdx = prev.findIndex(item => item.matchId === match.id);
          if (existingIdx > -1 && prev[existingIdx].oddName === oddName && prev[existingIdx].market === marketName) {
            return prev.filter((_, idx) => idx !== existingIdx);
          }
          const newItem = {
            matchId: match.id,
            matchCode: match.code,
            leagueName: match.leagueName,
            home: match.home,
            away: match.away,
            market: marketName,
            oddName,
            oddValue: parseFloat(oddValue)
          };
          if (existingIdx > -1) {
            const updated = [...prev];
            updated[existingIdx] = newItem;
            return updated;
          }
          return [...prev, newItem];
        });
      };

      const totalOdds = useMemo(() => {
        if (selectedBetSlip.length === 0) return "0.00";
        return selectedBetSlip.reduce((acc, item) => acc * item.oddValue, 1).toFixed(2);
      }, [selectedBetSlip]);

      const potentialPayout = useMemo(() => {
        return (parseFloat(totalOdds) * slipStake).toFixed(2);
      }, [totalOdds, slipStake]);

      // Kupon Yatırma
      const handlePlaceBet = () => {
        if (selectedBetSlip.length === 0) {
          alert("Lütfen kuponunuza en az bir karşılaşma ekleyin.");
          return;
        }

        if (coins < slipStake) {
          alert(`Yetersiz bakiye! Mevcut Bakiyeniz: ${coins} CC.`);
          return;
        }

        const newBet = {
          id: 'KP_' + Date.now().toString().slice(-6),
          date: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
          stake: parseFloat(slipStake),
          totalOdds: parseFloat(totalOdds),
          potentialPayout: parseFloat(potentialPayout),
          status: 'Devam Ediyor',
          canCashOut: true,
          cashOutValue: Math.floor(slipStake * 0.90),
          selections: [...selectedBetSlip]
        };

        const updatedHistory = [newBet, ...(currentUser.history || [])];
        const updatedCoins = coins - slipStake;

        const updatedDb = {
          ...usersDb,
          [activeUsername]: {
            ...currentUser,
            coins: updatedCoins,
            history: updatedHistory
          }
        };

        setUsersDb(updatedDb);
        localStorage.setItem('betcore_db_v4', JSON.stringify(updatedDb));

        setSelectedBetSlip([]);
        setMobileSlipOpen(false);
        if (soundEnabled) playChime('bet');

        alert(`Tebrikler! Kuponunuz başarıyla oynandı.\nKupon No: ${newBet.id}\nOlası Kazanç: ${newBet.potentialPayout} CC\nKuponlarım sekmesinden takip edebilirsiniz.`);
        setActiveTab('kuponlarim');
      };

      // Kupon Bozdurma
      const handleCashOut = (betId) => {
        const bet = betsHistory.find(b => b.id === betId);
        if (!bet || !bet.canCashOut) return;

        if (confirm(`${bet.cashOutValue} Core Coins karşılığında kuponu hemen bozdurmak istiyor musunuz?`)) {
          const updatedCoins = coins + bet.cashOutValue;
          const updatedHistory = betsHistory.map(b => b.id === betId ? { ...b, status: 'Bozduruldu', canCashOut: false } : b);

          const updatedDb = {
            ...usersDb,
            [activeUsername]: {
              ...currentUser,
              coins: updatedCoins,
              history: updatedHistory
            }
          };

          setUsersDb(updatedDb);
          localStorage.setItem('betcore_db_v4', JSON.stringify(updatedDb));
          if (soundEnabled) playChime('bet');
        }
      };

      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const uname = authUsername.trim();
        const pass = authPassword.trim();
        if (!uname || !pass) {
          setAuthMsg("Kullanıcı adı ve şifre zorunludur.");
          return;
        }

        if (authTab === 'login') {
          const user = usersDb[uname];
          if (!user || user.password !== pass) {
            setAuthMsg("Hatalı kullanıcı adı veya şifre!");
            return;
          }
          setActiveUsername(uname);
          setAuthModalOpen(false);
          setAuthMsg('');
        } else {
          if (usersDb[uname]) {
            setAuthMsg("Bu kullanıcı adı zaten alınmış!");
            return;
          }
          const newUser = {
            password: pass,
            coins: 5000,
            history: [],
            lastDailyBonusDate: todayStr
          };
          const updatedDb = { ...usersDb, [uname]: newUser };
          setUsersDb(updatedDb);
          setActiveUsername(uname);
          localStorage.setItem('betcore_db_v4', JSON.stringify(updatedDb));
          setAuthModalOpen(false);
          setAuthMsg('');
          alert("Hesabınız açıldı! 5.000 Core Coins kayıt bonusu tanımlandı.");
        }
      };

      // ================= KARARLI GRUPLAMA (SÜPER LİG & 1. LİG AYRIMI) =================
      const groupedFixtures = useMemo(() => {
        const filtered = fixtures.filter(m => {
          const leagueMatch = selectedLeagueId === 'all' || m.leagueId === selectedLeagueId;
          const searchMatch = m.home.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              m.away.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              m.code.includes(searchQuery);
          const tabMatch = activeTab === 'canli' ? m.isLive : true;
          return leagueMatch && searchMatch && tabMatch;
        });

        const groups = {};
        filtered.forEach(m => {
          if (!groups[m.leagueId]) {
            groups[m.leagueId] = {
              name: m.leagueName,
              flag: m.flag,
              matches: []
            };
          }
          groups[m.leagueId].matches.push(m);
        });

        return groups;
      }, [fixtures, selectedLeagueId, searchQuery, activeTab]);

      // ================= RENDER =================
      return h('div', { className: 'min-h-screen flex flex-col bg-[#121212]' },
        
        // Günlük Giriş Bildirimi
        dailyClaimedNotice && h('div', { className: 'bg-[#28A745] text-black px-4 py-2 text-center text-xs font-bold border-b border-black flex items-center justify-center space-x-2' },
          h('span', null, '🎁'),
          h('span', null, 'GÜNLÜK GİRİŞ BONUSU: 200 Core Coins hesabınıza aktarıldı!')
        ),

        // HEADER
        h('header', { className: 'bg-[#1A1A1A] border-b border-[#2C2C2C] sticky top-0 z-40' },
          h('div', { className: 'max-w-[1400px] mx-auto px-2 sm:px-4 h-12 flex items-center justify-between' },
            
            // Logo & Canlı Gösterge
            h('div', { className: 'flex items-center space-x-3' },
              h('div', {
                onClick: () => { setActiveTab('bulten'); setSelectedLeagueId('all'); },
                className: 'cursor-pointer flex items-center space-x-1 select-none'
              },
                h('div', { className: 'bg-[#F5B400] text-black font-black text-xl px-2 py-0.5 rounded-sm tracking-tighter' }, 'BET'),
