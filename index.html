    // --- SES MOTORU (Web Audio API) ---
    const playChime = (type = 'click') => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'bet') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
          osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.06);
        }
      } catch (e) {}
    };

    function App() {
      const todayStr = new Date().toISOString().slice(0, 10);

      // ================= KULLANICI & BAKİYE SİSTEMİ =================
      const [usersDb, setUsersDb] = useState(() => {
        try {
          const saved = localStorage.getItem('betcore_users_v2');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return {
          'Oyuncu_Core': {
            password: '123',
            coins: 5000, // Kayıt Bonusu 5000 CC
            history: [],
            lastDailyBonusDate: todayStr
          }
        };
      });

      const [activeUsername, setActiveUsername] = useState(() => {
        return localStorage.getItem('betcore_session_v2') || 'Oyuncu_Core';
      });

      const [dailyClaimedNotice, setDailyClaimedNotice] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);

      const currentUser = usersDb[activeUsername] || {
        password: '123',
        coins: 5000,
        history: [],
        lastDailyBonusDate: ''
      };

      const coins = currentUser.coins;
      const betsHistory = currentUser.history || [];

      // ================= GÜNLÜK 200 CC GİRİŞ BONUSU =================
      useEffect(() => {
        if (!activeUsername || !usersDb[activeUsername]) return;
        const user = usersDb[activeUsername];

        if (user.lastDailyBonusDate !== todayStr) {
          const updatedCoins = user.coins + 200;
          const updatedDb = {
            ...usersDb,
            [activeUsername]: {
              ...user,
              coins: updatedCoins,
              lastDailyBonusDate: todayStr
            }
          };
          setUsersDb(updatedDb);
          localStorage.setItem('betcore_users_v2', JSON.stringify(updatedDb));
          setDailyClaimedNotice(true);
          playChime('bet');
          setTimeout(() => setDailyClaimedNotice(false), 5000);
        }
      }, [activeUsername]);

      // Kalıcılık Senkronizasyonu
      useEffect(() => {
        localStorage.setItem('betcore_users_v2', JSON.stringify(usersDb));
      }, [usersDb]);

      useEffect(() => {
        localStorage.setItem('betcore_session_v2', activeUsername);
      }, [activeUsername]);

      // ================= BÜLTEN & KUPON DURUMLARI =================
      const [fixtures, setFixtures] = useState(INITIAL_FIXTURES);
      const [selectedLeagueId, setSelectedLeagueId] = useState('all');
      const [activeTab, setActiveTab] = useState('bulten'); // 'bulten' | 'canli' | 'kuponlarim' | 'kupondas'
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedBetSlip, setSelectedBetSlip] = useState([]);
      const [slipStake, setSlipStake] = useState(50);
      const [mobileSlipOpen, setMobileSlipOpen] = useState(false);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authTab, setAuthTab] = useState('login');
      const [authUsername, setAuthUsername] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authMsg, setAuthMsg] = useState('');

      // Arka planda gerçek canlı skorları sorgulama (sessiz polling)
      useEffect(() => {
        const interval = setInterval(async () => {
          try {
            const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard');
            if (!res.ok) return;
            const data = await res.json();
            if (data && data.events && data.events.length > 0) {
              setFixtures(prev => prev.map(m => {
                const liveMatch = data.events.find(ev => 
                  ev.name && (ev.name.toLowerCase().includes(m.home.toLowerCase()) || ev.name.toLowerCase().includes(m.away.toLowerCase()))
                );
                if (liveMatch && liveMatch.competitions?.[0]) {
                  const comp = liveMatch.competitions[0];
                  const h = comp.competitors?.find(c => c.homeAway === 'home');
                  const a = comp.competitors?.find(c => c.homeAway === 'away');
                  return {
                    ...m,
                    scoreHome: h?.score !== undefined ? parseInt(h.score) : m.scoreHome,
                    scoreAway: a?.score !== undefined ? parseInt(a.score) : m.scoreAway,
                    isLive: liveMatch.status?.type?.state === 'in',
                    minute: liveMatch.status?.displayClock ? `${liveMatch.status.displayClock}'` : m.minute
                  };
                }
                return m;
              }));
            }
          } catch (e) {}
        }, 60000);

        return () => clearInterval(interval);
      }, []);

      // ================= KUPONA MAÇ EKLEME / ÇIKARMA =================
      const toggleOdd = (match, marketName, oddName, oddValue) => {
        if (soundEnabled) playChime('click');
        setSelectedBetSlip(prev => {
          const existingIdx = prev.findIndex(item => item.matchId === match.id);
          if (existingIdx > -1 && prev[existingIdx].oddName === oddName && prev[existingIdx].market === marketName) {
            return prev.filter((_, idx) => idx !== existingIdx);
          }
          const newItem = {
            matchId: match.id,
            matchCode: match.code,
            leagueName: match.leagueName,
            home: match.home,
            away: match.away,
            market: marketName,
            oddName,
            oddValue: parseFloat(oddValue)
          };
          if (existingIdx > -1) {
            const updated = [...prev];
            updated[existingIdx] = newItem;
            return updated;
          }
          return [...prev, newItem];
        });
      };

      const totalOdds = useMemo(() => {
        if (selectedBetSlip.length === 0) return "0.00";
        return selectedBetSlip.reduce((acc, item) => acc * item.oddValue, 1).toFixed(2);
      }, [selectedBetSlip]);

      const potentialPayout = useMemo(() => {
        return (parseFloat(totalOdds) * slipStake).toFixed(2);
      }, [totalOdds, slipStake]);

      // ================= KUPON YATIRMA MOTORU (GARANTİLİ KAYIT) =================
      const handlePlaceBet = () => {
        if (selectedBetSlip.length === 0) {
          alert("Lütfen kuponunuza en az bir karşılaşma ekleyin.");
          return;
        }

        if (coins < slipStake) {
          alert(`Yetersiz bakiye! Mevcut Bakiyeniz: ${coins} CC. Misli miktarını azaltabilirsiniz.`);
          return;
        }

        const newBet = {
          id: 'KP_' + Date.now().toString().slice(-6),
          date: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
          stake: parseFloat(slipStake),
          totalOdds: parseFloat(totalOdds),
          potentialPayout: parseFloat(potentialPayout),
          status: 'Devam Ediyor',
          canCashOut: true,
          cashOutValue: Math.floor(slipStake * 0.90),
          selections: [...selectedBetSlip]
        };

        const updatedHistory = [newBet, ...(currentUser.history || [])];
        const updatedCoins = coins - slipStake;

        const updatedDb = {
          ...usersDb,
          [activeUsername]: {
            ...currentUser,
            coins: updatedCoins,
            history: updatedHistory
          }
        };

        // Doğrudan state ve localStorage'a anında yaz
        setUsersDb(updatedDb);
        localStorage.setItem('betcore_users_v2', JSON.stringify(updatedDb));

        setSelectedBetSlip([]);
        setMobileSlipOpen(false);
        if (soundEnabled) playChime('bet');

        alert(`Tebrikler! Kuponunuz başarıyla oynandı.\nKupon ID: ${newBet.id}\nOlası Kazanç: ${newBet.potentialPayout} CC\nKuponlarım sekmesinden takip edebilirsiniz.`);
        setActiveTab('kuponlarim');
      };

      // Kupon Bozdurma (Cash-Out)
      const handleCashOut = (betId) => {
        const bet = betsHistory.find(b => b.id === betId);
        if (!bet || !bet.canCashOut) return;

        if (confirm(`${bet.cashOutValue} Core Coins karşılığında kuponu hemen bozdurmak istiyor musunuz?`)) {
          const updatedCoins = coins + bet.cashOutValue;
          const updatedHistory = betsHistory.map(b => b.id === betId ? { ...b, status: 'Bozduruldu', canCashOut: false } : b);

          const updatedDb = {
            ...usersDb,
            [activeUsername]: {
              ...currentUser,
              coins: updatedCoins,
              history: updatedHistory
            }
          };

          setUsersDb(updatedDb);
          localStorage.setItem('betcore_users_v2', JSON.stringify(updatedDb));
          if (soundEnabled) playChime('bet');
        }
      };

      // Giriş & Kayıt İşlemleri
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const uname = authUsername.trim();
        const pass = authPassword.trim();
        if (!uname || !pass) {
          setAuthMsg("Kullanıcı adı ve şifre zorunludur.");
          return;
        }

        if (authTab === 'login') {
          const user = usersDb[uname];
          if (!user || user.password !== pass) {
            setAuthMsg("Hatalı kullanıcı adı veya şifre!");
            return;
          }
          setActiveUsername(uname);
          setAuthModalOpen(false);
          setAuthMsg('');
        } else {
          if (usersDb[uname]) {
            setAuthMsg("Bu kullanıcı adı zaten alınmış!");
            return;
          }
          const newUser = {
            password: pass,
            coins: 5000, // 5000 CC Kayıt Bonusu
            history: [],
            lastDailyBonusDate: todayStr
          };
          const updatedDb = { ...usersDb, [uname]: newUser };
          setUsersDb(updatedDb);
          setActiveUsername(uname);
          localStorage.setItem('betcore_users_v2', JSON.stringify(updatedDb));
          setAuthModalOpen(false);
          setAuthMsg('');
          alert("Hesabınız açıldı! 5.000 Core Coins kayıt bonusu hesabınıza tanımlandı.");
        }
      };

      // ================= LİG BAZINDA GRUPLANMIŞ BÜLTEN =================
      const groupedFixtures = useMemo(() => {
        const filtered = fixtures.filter(m => {
          const leagueMatch = selectedLeagueId === 'all' || m.leagueId === selectedLeagueId;
          const searchMatch = m.home.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              m.away.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              m.code.includes(searchQuery);
          const tabMatch = activeTab === 'canli' ? m.isLive : true;
          return leagueMatch && searchMatch && tabMatch;
        });

        const groups = {};
        filtered.forEach(m => {
          if (!groups[m.leagueId]) {
            groups[m.leagueId] = {
              name: m.leagueName,
              flag: m.flag,
              matches: []
            };
          }
          groups[m.leagueId].matches.push(m);
        });

        return groups;
      }, [fixtures, selectedLeagueId, searchQuery, activeTab]);

      return (
        <div className="min-h-screen flex flex-col bg-[#121212]">

          {/* GÜNLÜK GİRİŞ BONUSU BİLDİRİMİ */}
          {dailyClaimedNotice && (
            <div className="bg-[#28A745] text-black px-4 py-2 text-center text-xs font-bold border-b border-black flex items-center justify-center space-x-2">
              <span>🎁</span>
              <span>GÜNLÜK GİRİŞ BONUSU: 200 Core Coins hesabınıza aktarıldı!</span>
            </div>
          )}

          {/* ================= HEADER (NESINE KLASİK ÜST BAR) ================= */}
          <header className="bg-[#1A1A1A] border-b border-[#2C2C2C] sticky top-0 z-40">
            <div className="max-w-[1400px] mx-auto px-2 sm:px-4 h-12 flex items-center justify-between">
              
              {/* Sol: Logo */}
              <div className="flex items-center space-x-3">
                <div 
                  onClick={() => { setActiveTab('bulten'); setSelectedLeagueId('all'); }}
                  className="cursor-pointer flex items-center space-x-1 select-none"
                >
                  <div className="bg-[#F5B400] text-black font-black text-xl px-2 py-0.5 rounded-sm tracking-tighter">
                    BET
                  </div>
                  <span className="font-extrabold text-lg text-white tracking-tight">CORE</span>
                </div>

                <span className="hidden sm:inline text-[11px] text-gray-400 border-l border-[#333] pl-2.5">
                  İddaa Bülteni
                </span>
              </div>

              {/* Orta: Arama */}
              <div className="flex-1 max-w-xs mx-3 hidden md:block">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Takım veya maç kodu ara..."
                  className="w-full bg-[#0E0E0E] border border-[#333] text-gray-200 text-xs px-2.5 py-1.5 rounded-sm outline-none focus:border-[#F5B400]"
                />
              </div>

              {/* Sağ: Bakiye, Ses & Profil */}
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setSoundEnabled(!soundEnabled)}
                  title="Ses Aç / Kapat"
                  className="p-1.5 bg-[#252525] border border-[#333] text-gray-300 hover:text-white rounded-sm text-xs"
                >
                  {soundEnabled ? '🔔' : '🔕'}
                </button>

                {/* Bakiye Kutusu */}
                <div 
                  onClick={() => {
                    if (confirm("Bakiyenize 1.000 Core Coins eklemek istiyor musunuz?")) {
                      const updatedCoins = coins + 1000;
                      const updatedDb = { ...usersDb, [activeUsername]: { ...currentUser, coins: updatedCoins } };
                      setUsersDb(updatedDb);
                      localStorage.setItem('betcore_users_v2', JSON.stringify(updatedDb));
                    }
                  }}
                  className="bg-[#242424] border border-[#3A3A3A] px-2.5 py-1 rounded-sm text-right cursor-pointer"
                  title="Tıkla ve CC Ekle"
                >
                  <div className="text-[9px] text-gray-400 uppercase leading-none">Bakiye</div>
                  <div className="text-xs font-bold text-[#F5B400] font-mono leading-tight">
                    {coins.toLocaleString('tr-TR')} CC
                  </div>
                </div>

                {/* Kullanıcı Giriş / Profil Butonu */}
